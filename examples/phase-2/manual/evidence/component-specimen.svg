<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="3049" viewBox="0 0 1120 3049" role="img" aria-label="component-specimen"><title>component-specimen</title><rect width="100%" height="100%" fill="#F7F8F9"/><text x="32" y="40" font-family="Arial, PingFang SC, sans-serif" font-size="26" font-weight="600" letter-spacing="0" fill="#25333B">Component Specimen</text><text x="32" y="78" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#25333B">静读 / Margin — one essay, an unhurried decision · Generated specification; product styles resolve TOKENS.json</text><text x="32" y="135.5" font-family="Arial, PingFang SC, sans-serif" font-size="20" font-weight="600" letter-spacing="0" fill="#25333B">Primary reading action [button]</text><text x="32" y="165.5" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#25333B">Why: J-02: one concentrated accent commits to one essay; modest corners distinguish a control from the uncontained article. Content: Use conci</text><text x="32" y="185" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#25333B">se task labels; preserve full article titles rather than ellipsizing the primary decision.</text><text x="32" y="240.5" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#25333B">default</text><rect x="180" y="218.5" width="284" height="56" rx="6" fill="#8E382E" stroke="#F8F4EB" stroke-width="0" /><text x="192" y="250.5" font-family="PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0" fill="#FFFFFF">开始阅读 · Read now</text><text x="32" y="318.5" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#25333B">pressed</text><rect x="180" y="296.5" width="284" height="56" rx="6" fill="#702A23" stroke="#F8F4EB" stroke-width="0" /><text x="192" y="328.5" f