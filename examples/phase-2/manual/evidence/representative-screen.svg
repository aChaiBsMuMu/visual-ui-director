<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="静读 — compact representative screen"><title>静读 — compact representative screen</title><rect width="100%" height="100%" fill="#F8F4EB"/><text x="28" y="44" font-family="Arial, PingFang SC, sans-serif" font-size="18" font-weight="500" letter-spacing="0" fill="#292F2B">静读 / Margin</text><text x="28" y="80" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#5C635D">今日选读   文章归档   我的待读</text><text x="28" y="154" font-family="Songti SC, Georgia, serif" font-size="42" font-weight="500" letter-spacing="0" fill="#292F2B">城市里缓慢生长</text><text x="28" y="210" font-family="Songti SC, Georgia, serif" font-size="42" font-weight="500" letter-spacing="0" fill="#292F2B">的树</text><text x="28" y="266" font-family="Songti SC, Georgia, serif" font-size="23" font-weight="400" letter-spacing="0" fill="#5C635D">A quieter city</text><text x="28" y="324" font-family="PingFang SC, Arial, sans-serif" font-size="18" font-weight="400" letter-spacing="0" fill="#292F2B">用十二分钟，重新观察每天经过的街道。</text><text x="28" y="354" font-family="PingFang SC, Arial, sans-serif" font-size="18" font-weight="400" letter-spacing="0" fill="#292F2B">给今天，留下一段完整的阅读。</text><text x="28" y="406" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#5C635D">周一更新 · 约 12 分钟 · 中英双语</text><rect x="28" y="442" width="284" height="56" rx="6" fill="#8E382E" stroke="#F8F4EB" stroke-width="0" /><text x="40" y="474" font-family="PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0" fill="#FFFFFF">开始阅读 · Read now</text><rect x="28" y="510" width="284" height="56" rx="6" fill="#F8F4EB" stroke="#686F63" stroke-width="1" /><text x="40" y="542" font-family="PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0" fill="#292F2B">稍后再读 · Save</text><text x="28" y="600" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#5C635D">一次只选一篇。下次回来，仍从这里继续。</text></svg>
