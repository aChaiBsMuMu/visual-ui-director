B">Secondary save action [button]</text><text x="32" y="738.5" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#25333B">Why: J-06: saving is reversible and visually secondary; it must not compete with the reading CTA. Content: Use concise task labels; preserve f</text><text x="32" y="758" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#25333B">ull article titles rather than ellipsizing the primary decision.</text><text x="32" y="813.5" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#25333B">default</text><rect x="180" y="791.5" width="284" height="56" rx="6" fill="#F8F4EB" stroke="#686F63" stroke-width="1" /><text x="192" y="823.5" font-family="PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0" fill="#292F2B">稍后再读 · Save</text><text x="32" y="891.5" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#25333B">pressed</text><rect x="180" y="869.5" width="284" height="56" rx="6" fill="#F0DCD3" stroke="#F8F4EB" stroke-width="0" /><text x="192" y="901.5" font-family="PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0" fill="#702A23">已加入待读</text><text x="32" y="969.5" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#25333B">hover</text><rect x="180" y="947.5" width="284" height="56" rx="6" fill="#FFFCF5" stroke="#686F63" stroke-width="1" /><text x="192" y="979.5" font-family="PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0" fill="#292F2B">稍后再读 · Save</text><text x="32" y="1047.5" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#25333B">focus</text><rect x="180" y="1025.5" width="284" height="56" rx="6" fill="#F8F4EB" stroke="#686F63" stroke-width="1" /><rect x="176" y="1021.5" width="292" height="64" rx="9" fill="none" stroke="#26566E" stroke-width="2" /><text x="192" y="1057.5" font-family="PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0" fill="#292F2B">稍后再读 · Save</text><text x="32" y="1125.5" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#25333B">disabled</text><rect x="180" y="1103.5" width="284" height="56" rx="6" fill="#E4E4DC" stroke="#F8F4EB" stroke-width="0" /><text x="192" y="1135.5" font-family="PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0" fill="#5C635A">当前不可保存</text><text x="32" y="1203.5" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#25333B">loading</text><rect x="180" y="1181.5" width="284" height="56" rx="6" fill="#F8F4EB" stroke="#F8F4EB" stroke-width="0" /><text x="192" y="1213.5" font-family="PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0" fill="#5C635D">正在保存…</text><text x="32" y="1281.5" font-family="Arial, PingFang SC, sans-serif" font-size="20" font-weight="600" letter-spacing="0" fill="#25333B">Uncontained essay summary [surface]</text><text x="32" y="1311.5" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#25333B">Why: J-05: whitespace contains editorial content; a border would imply an unrelated clickable card. Content: Use concise task labels; preserve</text><text x="32" y="1331" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#25333B"> full article titles rather than ellipsizing the primary decision.</text><text x="32" y="1386.5" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#25333B">default</text><rect x="180" y="1364.5" width="720" height="114" rx="0" fill="#F8F4EB" stroke="#F8F4EB" stroke-width="0" /><text x="192" y="1414.5" font-family="PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0" fill="#292F2B">城市里缓慢生长的树</text><text x="192" y="1436.5" font-family="PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0" fill="#292F2B">用十二分钟，重新观察每天经过的街道。</text><text x="32" y="1522.5" font-family="Arial, PingFang SC, sans-serif" font-size="20" font-weight="600" letter-spacing="0" fill="#25333B">Archive search [input]</text><text x="32" y="1552.5" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#25333B">Why: J-06: a visible input boundary distinguishes editing from reading. Content: Use concise task labels; preserve full article titles rather</text><text x="32" y="1572" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#25333B">than ellipsizing the primary decision.</text><text x="32" y="1627.5" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#25333B">default</text><rect x="180" y="1605.5" width="720" height="56" rx="6" fill="#FFFCF5" stroke="#686F63" stroke-width="1" /><text x="192" y="1637.5" font-family="PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0" fill="#5C635D">搜索文章标题</text><text x="32" y="1705.5" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#25333B">focus</text><rect x="180" y="1683.5" width="720" height="56" rx="6" fill="#FFFCF5" stroke="#26566E" stroke-width="2" /><rect x="176" y="1679.5" width="728" height="64" rx="9" fill="none" stroke="#26566E" stroke-width="2" /><text x="192" y="1715.5" font-family="PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0" fill="#292F2B">城市里的树</text><text x="32" y="1783.5" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#25333B">disabled</text><rect x="180" y="1761.5" width="720" height="56" rx="6" fill="#E4E4DC" stroke="#F8F4EB" stroke-width="0" /><text x="192" y="1793.5" font-family="PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0" fill="#5C635A">离线索引尚未准备好</text><text x="32" y="1861.5" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#25333B">error</text><rect x="180" y="1839.5" width="720" height="56" rx="6" fill="#FFFCF5" stroke="#A12C2C" stroke-width="1" /><text x="192" y="1871.5" font-family="PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0" fill="#A12C2C">请输入至少一个文字</text><text x="32" y="1917.5" font-family="Arial, PingFang SC, sans-serif" font-size="12" font-weight="400" letter-spacing="0" fill="#25333B">hover excluded: Focus defines editing; hover adds no separate meaning to this text field.</text><text x="32" y="1957.5" font-family="Arial, PingFang SC, sans-serif" font-size="20" font-weight="600" letter-spacing="0" fill="#25333B">Text navigation [navigation]</text><text x="32" y="1987.5" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#25333B">Why: J-10: native links preserve browser navigation and remain subordinate to the essay title. Content: Use concise task labels; preserve full</text><text x="32" y="2007" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#25333B"> article titles rather than ellipsizing the primary decision.</text><text x="32" y="2062.5" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#25333B">default</text><rect x="180" y="2040.5" width="720" height="56" rx="6" fill="#F8F4EB" stroke="#F8F4EB" stroke-width="0" /><text x="192" y="2073.75" font-family="PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0" fill="#292F2B">今日选读</text><text x="432" y="2073.75" font-family="PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0" fill="#292F2B">文章归档</text><text x="672" y="2073.75" font-family="PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0" fill="#292F2B">我的待读</text><text x="32" y="2140.5" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#25333B">selected</text><rect x="180" y="2118.5" width="720" height="56" rx="6" fill="#F8F4EB" stroke="#F8F4EB" stroke-width="0" /><text x="192" y="2151.75" font-family="PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0" fill="#8E382E">今日选读</text><text x="432" y="2151.75" font-family="PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0" fill="#292F2B">文章归档</text><text x="672" y="2151.75" font-family="PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0" fill="#292F2B">我的待读</text><rect x="192" y="2169.5" width="216" height="3" rx="0" fill="#8E382E" stroke="#B8C2C8" stroke-width="0" /><text x="32" y="2218.5" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#25333B">focus</text><rect x="180" y="2196.5" width="720" height="56" rx="6" fill="#F8F4EB" stroke="#F8F4EB" stroke-width="0" /><rect x="176" y="2192.5" width="248" height="64" rx="9" fill="none" stroke="#26566E" stroke-width="2" /><text x="192" y="2229.75" font-family="PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0" fill="#292F2B">今日选读</text><text x="432" y="2229.75" font-family="PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0" fill="#292F2B">文章归档</text><text x="672" y="2229.75" font-family="PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0" fill="#292F2B">我的待读</text><text x="32" y="2274.5" font-family="Arial, PingFang SC, sans-serif" font-size="12" font-weight="400" letter-spacing="0" fill="#25333B">hover excluded: Underline native links on hover; no separate surface treatment is needed.</text><text x="32" y="2314.5" font-family="Arial, PingFang SC, sans-serif" font-size="20" font-weight="600" letter-spacing="0" fill="#25333B">Language filter [chip]</text><text x="32" y="2344.5" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#25333B">Why: J-07: a small rectangular selection field is sufficient; pill containers would overemphasize filters. Content: Use concise task labels; p</text><text x="32" y="2364" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#25333B">reserve full article titles rather than ellipsizing the primary decision.</text><text x="32" y="2419.5" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#25333B">default</text><rect x="180" y="2397.5" width="190" height="50" rx="3" fill="#F8F4EB" stroke="#F8F4EB" stroke-width="0" /><text x="192" y="2426.5" font-family="PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0" fill="#292F2B">中文 · Chinese</text><text x="32" y="2491.5" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#25333B">selected</text><rect x="180" y="2469.5" width="190" height="50" rx="3" fill="#F0DCD3" stroke="#F8F4EB" stroke-width="0" /><text x="192" y="2498.5" font-family="PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0" fill="#702A23">中文 · Chinese</text><text x="32" y="2563.5" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#25333B">focus</text><rect x="180" y="2541.5" width="190" height="50" rx="3" fill="#F8F4EB" stroke="#F8F4EB" stroke-width="0" /><rect x="176" y="2537.5" width="198" height="58" rx="6" fill="none" stroke="#26566E" stroke-width="2" /><text x="192" y="2570.5" font-family="PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0" fill="#292F2B">中文 · Chinese</text><text x="32" y="2613.5" font-family="Arial, PingFang SC, sans-serif" font-size="12" font-weight="400" letter-spacing="0" fill="#25333B">hover excluded: Text underline conveys pointer affordance without adding an accent.</text><text x="32" y="2653.5" font-family="Arial, PingFang SC, sans-serif" font-size="20" font-weight="600" letter-spacing="0" fill="#25333B">Save result and recovery [feedback]</text><text x="32" y="2683.5" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#25333B">Why: J-09: feedback explains state while leaving the reading column stable. Content: Use concise task labels; preserve full article titles rat</text><text x="32" y="2703" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#25333B">her than ellipsizing the primary decision.</text><text x="32" y="2758.5" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#25333B">default</text><rect x="180" y="2736.5" width="720" height="68" rx="6" fill="#FFFCF5" stroke="#F8F4EB" stroke-width="0" /><text x="192" y="2774.5" font-family="PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0" fill="#326247">已保存，下次从这里继续。</text><text x="32" y="2848.5" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#25333B">error</text><rect x="180" y="2826.5" width="720" height="68" rx="6" fill="#FFFCF5" stroke="#F8F4EB" stroke-width="0" /><text x="192" y="2864.5" font-family="PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0" fill="#A12C2C">保存失败。文章仍在，请重试。</text><text x="32" y="2938.5" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#25333B">loading</text><rect x="180" y="2916.5" width="720" height="68" rx="6" fill="#FFFCF5" stroke="#F8F4EB" stroke-width="0" /><text x="192" y="2954.5" font-family="PingFang SC, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0" fill="#5C635D">正在同步阅读位置…</text></svg>
